<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>찬양 콘티 대시보드</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" content="#1B2430" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="찬양 콘티" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  :root{
    --ink:#1B2430; --ink-panel:#232D3D; --ink-border:#3A465A; --ink-text:#F1EDE4; --ink-sub:#8A96A6;
    --paper:#F7F2E7; --paper-dim:#EFE8D8; --paper-border:#E4D9BC; --input-border:#D8C89A;
    --brass:#C9A66B; --brass-dark:#7A5A22; --text:#3E3323; --muted:#8A7A56;
    --danger:#B5533C; --blue:#4A6FA5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);font-family:'Noto Sans KR',sans-serif;color:var(--text);}
  .serif{font-family:'Noto Serif KR',serif;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px;}
  .header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding:0 4px;}
  .header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
  .header{flex-wrap:wrap;}
  .title h1,.title p{word-break:keep-all;}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--ink-panel);border:1px solid var(--ink-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  .title h1{font-size:20px;font-weight:700;color:var(--ink-text);margin:0;}
  .title p{font-size:12px;color:var(--ink-sub);margin:2px 0 0;}
  .save-status{font-size:13px;color:var(--brass);display:flex;align-items:center;gap:6px;text-align:right;max-width:45%;word-break:break-word;}
  .save-status.error{color:#D9776A;}
  .warnbar{margin-bottom:12px;padding:10px 14px;border-radius:10px;background:#3A2A2A;border:1px solid var(--danger);color:#F1CFC7;font-size:13px;line-height:1.6;}
  .tabs{display:flex;gap:4px;padding:0 4px;overflow-x:auto;}
  .tab-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:600;font-size:14px;background:var(--ink-panel);color:var(--ink-sub);border:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;flex-shrink:0;}
  .tab-btn.active{background:var(--paper);color:var(--text);border:1px solid var(--paper-border);border-bottom-color:var(--paper);transform:translateY(1px);}
  .panel{background:var(--paper);border-radius:0 16px 16px 16px;min-height:480px;box-shadow:0 20px 40px rgba(0,0,0,0.3);}
  .tab-content{padding:20px;}
  @media(min-width:640px){.tab-content{padding:32px;}}
  h2.section-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--text);margin:0 0 12px;}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px;border-radius:12px;background:var(--paper-dim);border:1px dashed #CBB98C;}
  .empty .icon{font-size:26px;}
  .empty .t{margin-top:10px;font-weight:600;color:#5A4A2C;}
  .empty .s{margin-top:4px;font-size:13px;color:#8A7A56;}
  input[type=text],input[type=date],input[type=search],select,textarea{
    border:1px solid var(--input-border);background:#fff;color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit;
  }
  textarea{width:100%;resize:vertical;line-height:1.7;}
  .btn{border:none;border-radius:10px;font-weight:600;font-size:13px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-dark{background:var(--text);color:#F1EDE4;}
  .btn-light{background:var(--paper-border);color:#5A4A2C;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .row{display:flex;gap:8px;}
  .card{border-radius:14px;padding:16px 18px;background:var(--paper-dim);border:1px solid var(--paper-border);}
  .card.dark{background:var(--ink-panel);border-color:var(--ink-border);}
  .chiplist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .chiplist li{display:flex;align-items:center;gap:6px;font-size:14px;}
  .chiplist .num{width:16px;font-size:12px;color:var(--muted);flex-shrink:0;}
  .chiplist button.icon{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px;}
  .chiplist button.icon.del{color:#B58B7A;}
  .numlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .numlist li{display:flex;align-items:baseline;gap:8px;font-size:14px;}
  .numlist .num{width:16px;font-size:12px;color:var(--muted);flex-shrink:0;}
  .divider-dash{border-top:1px dashed var(--input-border);margin:12px 0;padding-top:12px;}
  .sub-label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;}
  .accordion{border-radius:14px;overflow:hidden;border:1px solid var(--paper-border);}
  .acc-row{border-top:1px solid var(--paper-border);}
  .acc-row:first-child{border-top:none;}
  .acc-header{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--paper);border:none;cursor:pointer;text-align:left;}
  .acc-header.open{background:var(--paper-dim);}
  .acc-title-btn{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;background:none;border:none;cursor:pointer;text-align:left;padding:0;}
  .acc-title-btn span.t{font-weight:500;font-size:15px;color:var(--text);word-break:break-word;}
  .acc-badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--paper-border);color:#7A5A22;font-weight:600;white-space:nowrap;}
  .acc-body{padding:10px 16px 16px;background:var(--paper-dim);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px;display:inline-flex;align-items:center;gap:4px;}
  .img-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .img-item{position:relative;width:100px;}
  .img-item img{width:100px;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--input-border);display:block;}
  .img-item canvas.thumb-ann{position:absolute;left:0;top:0;width:100px;height:130px;border-radius:8px;pointer-events:none;}
  .img-item .ann-badge{position:absolute;left:4px;bottom:4px;background:rgba(27,36,48,.85);color:#F1EDE4;font-size:10px;padding:1px 5px;border-radius:6px;pointer-events:none;}
  .img-item .del{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .stat-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .stat-title{width:120px;flex-shrink:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat-bar-track{flex:1;height:12px;border-radius:999px;background:var(--paper-border);}
  .stat-bar-fill{height:12px;border-radius:999px;background:var(--brass);}
  .stat-count{width:34px;text-align:right;font-size:12px;font-weight:600;color:var(--muted);}
  .stat-rank{width:20px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--brass-dark);}
  .stats-table{border-collapse:collapse;width:100%;font-size:13px;}
  .stats-table th{background:var(--paper-dim);border:1px solid var(--paper-border);padding:8px 10px;text-align:left;color:var(--muted);font-weight:600;white-space:nowrap;}
  .stats-table td{border:1px solid var(--paper-border);padding:8px 10px;color:var(--text);}
  .stats-table tr:nth-child(even) td{background:#FBF8F1;}
  .home-grid{display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:768px){.home-grid{grid-template-columns:1fr 1fr;position:relative;} .home-spine{position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,#CBB98C,transparent);}}
  .eyebrow{font-family:'Noto Serif KR',serif;font-size:11px;letter-spacing:0.1em;color:#B79A5C;margin:0 0 4px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{width:28px;height:28px;border-radius:999px;border:none;background:none;cursor:pointer;color:#6B5B3A;font-size:15px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-wd{font-size:12px;font-weight:600;padding:4px 0;color:#8A7A56;}
  .cal-wd.sun{color:#C97B6B;}
  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;background:none;border:none;cursor:default;color:var(--text);}
  .cal-cell.has{cursor:pointer;font-weight:700;}
  .cal-cell.today{background:var(--paper-border);}
  .cal-cell.selected{background:var(--brass);color:#fff;}
  .cal-dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--brass);}
  .warn{font-size:12px;color:#8A7A56;margin-top:8px;line-height:1.6;}
  a.ylink{color:#8A5A3A;word-break:break-all;}
  a.ylink.dark{color:var(--brass);}
  .bulkbox{margin-bottom:14px;border:1px dashed var(--brass);border-radius:10px;}
  .bulkbox summary{cursor:pointer;padding:8px 12px;font-size:12px;font-weight:700;color:var(--brass-dark);list-style:none;}
  .bulkbox summary::-webkit-details-marker{display:none;}
  .bulkbox .inner{padding:0 12px 12px;}
  /* presentation modal */
  #present{position:fixed;inset:0;background:#141A24;z-index:999;display:none;flex-direction:column;}
  #present.open{display:flex;}
  .p-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;background:#1B2430;border-bottom:1px solid #3A465A;flex-wrap:wrap;}
  .p-top .meta p{margin:0;}
  .p-top .meta .d{font-size:11px;color:#8A96A6;}
  .p-top .meta .t{font-weight:700;color:#F1EDE4;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .p-actions button{border:none;border-radius:8px;font-size:12px;font-weight:700;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .p-note{font-size:11px;text-align:center;padding:6px 16px;background:#1B2430;color:#6B7688;}
  .p-body{flex:1;display:flex;overflow:hidden;position:relative;}
  .p-nav{width:48px;flex-shrink:0;background:none;border:none;color:var(--brass);font-size:26px;cursor:pointer;}
  .p-nav:disabled{opacity:0.2;}
  .p-content{flex:1;overflow:auto;padding:16px;}
  .p-content .inner{max-width:720px;margin:0 auto;}
  #p-songform{width:100%;border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px;background:#232D3D;border:1px solid #3A465A;color:#F1EDE4;}
  .p-noimg{border-radius:12px;padding:40px;text-align:center;background:#232D3D;border:1px dashed #3A465A;color:#8A96A6;}
  .p-imgs img{width:100%;border-radius:8px;border:1px solid #3A465A;display:block;background:#fff;}
  .p-stage{position:relative;display:block;line-height:0;}
  #p-canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;border-radius:8px;}
  #present.drawing .p-touchzone{display:none !important;}
  #present.drawing #p-canvas{cursor:crosshair;}
  .p-tools{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);z-index:40;
    background:rgba(27,36,48,.97);border:1px solid #3A465A;border-radius:16px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.55);
    align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);}
  #present.drawing .p-tools{display:flex;}
  #present.drawing .p-exit{display:none !important;}
  .p-swatch{width:30px;height:30px;border-radius:999px;border:2px solid transparent;cursor:pointer;padding:0;flex-shrink:0;}
  .p-swatch.on{border-color:#fff;transform:scale(1.12);}
  .p-tool-btn{background:#2C3A4D;color:#F1EDE4;border:1px solid #3A465A;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .p-tool-btn.on{background:var(--brass);color:#fff;border-color:var(--brass);}
  .p-tool-sep{width:1px;height:24px;background:#3A465A;flex-shrink:0;}
  .p-dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:#1B2430;flex-wrap:wrap;}
  .p-dots button{border:none;border-radius:999px;background:#3A465A;cursor:pointer;padding:0;}
  .p-dots button.on{background:var(--brass);}
  #present.focus .p-top,#present.focus .p-note,#present.focus .p-dots,#present.focus .p-nav{display:none;}
  #present.focus .p-exit{display:flex !important;}
  /* close button lives at the BOTTOM, where there's empty space, so it never covers the score */
  .p-exit{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);right:calc(env(safe-area-inset-right, 0px) + 20px);width:52px;height:52px;border-radius:999px;background:rgba(35,45,61,.94);color:#F1EDE4;border:1px solid #3A465A;z-index:30;align-items:center;justify-content:center;cursor:pointer;font-size:22px;box-shadow:0 4px 16px rgba(0,0,0,.5);}
  /* in focus mode the score sits vertically centred, clear of the notch */
  #present.focus .p-content{padding:calc(env(safe-area-inset-top, 0px) + 16px) 14px calc(env(safe-area-inset-bottom, 0px) + 88px);display:flex;flex-direction:column;justify-content:center;}
  #present.focus .p-content .inner{width:100%;}
  #present.focus #p-songform{margin-bottom:16px;}
  #present.focus .p-page-label{display:block;}
  .p-page-label{display:none;text-align:center;font-size:12px;color:#8A96A6;margin-bottom:10px;}
  /* tap zones only exist in focus mode, and always sit BELOW the exit button */
  .p-touchzone{display:none;position:absolute;top:0;bottom:calc(env(safe-area-inset-bottom, 0px) + 92px);width:18%;z-index:1;}
  #present.focus .p-touchzone{display:block;}
  /* login screen */
  #login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--ink);z-index:500;}
  .login-card{width:100%;max-width:340px;background:var(--ink-panel);border:1px solid var(--ink-border);border-radius:18px;padding:28px 24px;}
  .login-card input{width:100%;}
</style>
</head>
<body>

<script type="module">
  // loaded separately because the main script is a classic (non-module) script
  try {
    const mod = await import("https://esm.sh/@vercel/blob@0.27.3/client");
    window.__blobUpload = mod.upload;
  } catch (e) {
    console.warn("Blob SDK 로드 실패, base64 방식으로 대체합니다", e);
  }
  window.__blobReady = true;
</script>

<div id="login-screen">
  <div class="login-card">
    <div class="logo" style="margin:0 auto 14px;">📖</div>
    <h1 class="serif" style="margin:0 0 6px;font-size:20px;color:var(--ink-text);text-align:center;">찬양 콘티 대시보드</h1>
    <p style="margin:0 0 20px;font-size:13px;color:var(--ink-sub);text-align:center;">공용 비밀번호를 입력해주세요</p>
    <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" />
    <p id="login-error" style="color:#D9776A;font-size:13px;margin:10px 0 0;min-height:18px;"></p>
    <p id="setup-note" style="font-size:12px;line-height:1.6;margin:4px 0 0;color:var(--ink-sub);"></p>
    <button class="btn btn-brass" id="login-btn" style="width:100%;justify-content:center;margin-top:8px;">들어가기</button>
  </div>
</div>

<div id="app-screen" style="display:none;">
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <div class="logo">📖</div>
      <div class="title">
        <h1 class="serif">찬양 콘티 대시보드</h1>
        <p>모든 기기에서 자동 동기화돼요</p>
      </div>
    </div>
    <div id="save-status" class="save-status"></div>
  </div>
  <div class="row" style="margin-bottom:16px;flex-wrap:wrap;align-items:center;">
    <button class="btn btn-light" id="refresh-btn">↻ 새로고침</button>
    <button class="btn btn-brass" id="backup-export">⬇ 백업 저장</button>
    <button class="btn btn-light" id="backup-import-btn">⬆ 백업 불러오기</button>
    <input type="file" id="backup-import-file" accept=".json,application/json" style="display:none;" />
    <button class="btn btn-light" id="logout-btn" style="margin-left:auto;">로그아웃</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel"><div class="tab-content" id="content"></div></div>
</div>
</div>

<div id="present">
  <button class="p-exit" id="p-exit-btn">✕</button>
  <div class="p-tools" id="p-tools">
    <button class="p-swatch on" data-color="#E02B2B" style="background:#E02B2B;"></button>
    <button class="p-swatch" data-color="#1B62D6" style="background:#1B62D6;"></button>
    <button class="p-swatch" data-color="#12A150" style="background:#12A150;"></button>
    <button class="p-swatch" data-color="#111111" style="background:#111111;"></button>
    <button class="p-swatch" data-color="#FFE14D" style="background:#FFE14D;"></button>
    <div class="p-tool-sep"></div>
    <button class="p-tool-btn on" id="p-tool-pen">✏️ 펜</button>
    <button class="p-tool-btn" id="p-tool-hl">🖍 형광펜</button>
    <button class="p-tool-btn" id="p-tool-eraser">🧽 지우개</button>
    <div class="p-tool-sep"></div>
    <button class="p-tool-btn" id="p-tool-undo">↶ 되돌리기</button>
    <button class="p-tool-btn" id="p-tool-clear">전체지움</button>
    <button class="p-tool-btn" id="p-tool-done" style="background:var(--brass);color:#fff;border-color:var(--brass);">완료</button>
  </div>
  <div class="p-top">
    <div class="meta">
      <p class="d" id="p-date"></p>
      <p class="t" id="p-title"></p>
    </div>
    <div class="p-actions">
      <button class="btn-brass" id="p-pdf">⬇ PDF 인쇄</button>
      <button style="background:#3A465A;color:#F1EDE4;" id="p-txt">⬇ 가사 TXT</button>
      <button style="background:#3A465A;color:#F1EDE4;" id="p-draw">✏️ 필기</button>
      <button style="background:#3A465A;color:#F1EDE4;" id="p-focus">⤢ 전체로 보기</button>
      <button style="background:#B5533C;color:#fff;" id="p-close">✕</button>
    </div>
  </div>
  <p class="p-note">"PDF 인쇄"는 새 창에서 인쇄 대화상자를 열어요 → "PDF로 저장"을 선택하세요.</p>
  <div class="p-body">
    <button class="p-nav" id="p-prev">‹</button>
    <div class="p-content"><div class="inner">
      <p class="p-page-label" id="p-page-label"></p>
      <textarea id="p-songform" rows="2" placeholder="송폼 / 조 표시를 여기에 기록하세요"></textarea>
      <div id="p-imgwrap"></div>
    </div></div>
    <button class="p-nav" id="p-next">›</button>
    <div class="p-touchzone" id="p-touch-left" style="left:0;"></div>
    <div class="p-touchzone" id="p-touch-right" style="right:0;"></div>
  </div>
  <div class="p-dots" id="p-dots"></div>
</div>

<script>
// ---------- storage keys ----------
const WEEKDAY_KR = ["일","월","화","수","목","금","토"];
const MONTH_KR = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

// ---------- helpers ----------
const pad2 = (n) => String(n).padStart(2,"0");
const toISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseISO = (s) => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function esc(s){ const d=document.createElement("div"); d.textContent=String(s); return d.innerHTML; }
function getWeekRange(date){
  const d=new Date(date); const day=d.getDay();
  const start=new Date(d); start.setDate(d.getDate()-day); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(start.getDate()+6); end.setHours(0,0,0,0);
  return [start,end];
}
function getMonthGrid(year,month){
  const firstDay=new Date(year,month,1); const startWeekday=firstDay.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(year,month,d));
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function getAllSongs(){
  const set=new Set();
  state.setlists.forEach(e=>e.songs.forEach(s=>set.add(s)));
  Object.keys(state.scores).forEach(s=>set.add(s));
  Object.keys(state.lyrics).forEach(s=>set.add(s));
  return Array.from(set);
}
function usageCount(title){ return state.setlists.reduce((acc,e)=>acc+(e.songs.includes(title)?1:0),0); }
function parseTitleCode(raw){
  const m = raw.match(/^(.*)\(([^()]+)\)\s*$/);
  if (m) return { base: m[1].trim(), code: m[2].trim() };
  return { base: raw, code: "" };
}
function parseHymn(raw){
  const m = raw.match(/^\s*(\d+)\s*장[_\s]*(.*)$/);
  if (m) return { num: m[1], title: m[2].trim() || raw };
  return { num: "", title: raw };
}
function parseBulkSetlist(text){
  const songs=[], hymns=[];
  (text||"").split(/\r?\n/).forEach(lineRaw=>{
    const line=lineRaw.trim();
    if(!line) return;
    const hm=line.match(/^찬송가\s*[-:–—]?\s*(.+)$/);
    if(hm){ hymns.push(hm[1].trim()); return; }
    const cleaned=line.replace(/^\d+\s*[.)]\s*/,"").trim();
    if(cleaned) songs.push(cleaned);
  });
  return { songs, hymns };
}
// Full-size originals go straight to Blob storage (no size limit, no quality loss).
// If Blob isn't set up we fall back to an inline compressed copy so the app still works.
function compressToDataUrl(file, maxDim=1400, quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maxDim||height>maxDim){ const scale=maxDim/Math.max(width,height); width=Math.round(width*scale); height=Math.round(height*scale); }
        const canvas=document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror=()=>reject(new Error("이미지를 불러올 수 없습니다"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("파일을 읽을 수 없습니다"));
    reader.readAsDataURL(file);
  });
}

async function waitForBlobSdk(){
  for (let i=0; i<40 && !window.__blobReady; i++) await new Promise(r=>setTimeout(r,50));
  return window.__blobUpload || null;
}

// returns {id, name, url} when uploaded to Blob, or {id, name, dataUrl} as fallback
async function uploadScoreImage(file){
  const upload = await waitForBlobSdk();
  if (upload) {
    try {
      const safeName = (file.name || "score").replace(/[^\w.\-가-힣]/g, "_");
      const blob = await upload(`scores/${Date.now()}-${safeName}`, file, {
        access: "public",
        handleUploadUrl: "/api/blob-upload",
        contentType: file.type || "image/jpeg",
      });
      return { id: uid(), name: file.name, url: blob.url };
    } catch (e) {
      console.warn("Blob 업로드 실패, 압축 저장으로 대체합니다:", e && e.message);
      setStatus("이미지 저장소 오류 — 압축해서 저장했어요", true);
    }
  }
  const dataUrl = await compressToDataUrl(file);
  return { id: uid(), name: file.name, dataUrl };
}

// images may be stored either as a Blob URL or an inline data URL
function imgSrc(im){ return im.url || im.dataUrl || ""; }

// free the stored file when an image is deleted (best-effort)
function releaseImage(im){
  if (!im || !im.url) return;
  fetch("/api/blob-delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: im.url }),
  }).catch(()=>{});
}

// Draws the score plus its handwriting onto one canvas and returns a data URL,
// so printed/exported copies include the annotations. Returns null if the image
// can't be read into a canvas (cross-origin), in which case the caller falls back.
async function flattenAnnotated(im, strokes){
  try {
    const src = imgSrc(im);
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.crossOrigin = "anonymous";
      el.onload = () => resolve(el);
      el.onerror = reject;
      el.src = src;
    });
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth || 1000;
    cv.height = img.naturalHeight || 1400;
    const ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    paintStrokes(ctx, strokes, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", 0.9);
  } catch (e) {
    return null;
  }
}

// Word export needs the bytes inline, otherwise the .doc breaks when offline
async function toDataUrl(im){
  if (im.dataUrl) return im.dataUrl;
  if (!im.url) return "";
  try {
    const res = await fetch(im.url);
    const blob = await res.blob();
    return await new Promise((resolve)=>{
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => resolve("");
      r.readAsDataURL(blob);
    });
  } catch (e) { return ""; }
}

function downloadTextFile(filename, text){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------- persistence: server API (shared across all devices) ----------
// Data is chunked per song so each save request stays small.
const SCORE_PREFIX = "score:";
const HYMN_SCORE_PREFIX = "hymnScore:";

let lastSaved = {};      // key -> JSON string of what the server already has
let saveTimer = null;
let saveInFlight = false;
let savePending = false;
let pendingDirty = false;   // true from the moment an edit happens until it reaches the server

function setStatus(text, isError){
  const el = document.getElementById("save-status");
  if(!el) return;
  el.className = isError ? "save-status error" : "save-status";
  el.textContent = text;
}

async function api(path, options){
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
  if (res.status === 401) { showLogin(); throw new Error("로그인이 필요해요"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}

// Build the flat key->value map the server stores, from in-memory state.
function buildServerMap(){
  const map = {};
  map["setlists"] = state.setlists;
  map["lyrics"] = state.lyrics;
  map["hymnLyrics"] = state.hymnLyrics;

  const scoreIndex = {};
  Object.entries(state.scores).forEach(([title, rec]) => {
    if (!rec.keyId) rec.keyId = uid();
    scoreIndex[title] = rec.keyId;
    map[SCORE_PREFIX + rec.keyId] = { images: rec.images || [], songForm: rec.songForm || "", ann: rec.ann || {} };
  });
  map["scoreIndex"] = scoreIndex;

  const hymnIndex = {};
  Object.entries(state.hymnScores).forEach(([title, rec]) => {
    if (!rec.keyId) rec.keyId = uid();
    hymnIndex[title] = rec.keyId;
    map[HYMN_SCORE_PREFIX + rec.keyId] = { images: rec.images || [], songForm: rec.songForm || "", ann: rec.ann || {} };
  });
  map["hymnScoreIndex"] = hymnIndex;

  return map;
}

function scheduleSave(){
  setStatus("저장 중...");
  pendingDirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 400);
}

async function doSave(){
  if (saveInFlight) { savePending = true; return; }
  saveInFlight = true;
  try {
    const map = buildServerMap();
    const sets = [];
    for (const [key, value] of Object.entries(map)) {
      const str = JSON.stringify(value);
      if (lastSaved[key] !== str) sets.push({ key, value, _str: str });
    }
    const deletes = Object.keys(lastSaved).filter((k) => !(k in map));

    if (sets.length === 0 && deletes.length === 0) { pendingDirty = false; setStatus("저장됨"); return; }

    // send in small batches so a single request never gets too large
    for (let i = 0; i < sets.length; i += 3) {
      const batch = sets.slice(i, i + 3);
      await api("/api/data", {
        method: "POST",
        body: JSON.stringify({ sets: batch.map(({ key, value }) => ({ key, value })), deletes: [] }),
      });
      batch.forEach((b) => { lastSaved[b.key] = b._str; });
    }
    if (deletes.length) {
      await api("/api/data", { method: "POST", body: JSON.stringify({ sets: [], deletes }) });
      deletes.forEach((k) => { delete lastSaved[k]; });
    }
    pendingDirty = false;
    setStatus("저장됨 · 모든 기기 동기화");
  } catch (e) {
    setStatus("저장 실패: " + (e && e.message ? e.message : "오류"), true);
  } finally {
    saveInFlight = false;
    if (savePending) { savePending = false; doSave(); }
  }
}

async function loadAll(){
  const { data } = await api("/api/data");
  lastSaved = {};
  Object.entries(data).forEach(([k, v]) => { lastSaved[k] = JSON.stringify(v); });

  state.setlists = Array.isArray(data.setlists) ? data.setlists : [];
  state.lyrics = data.lyrics && typeof data.lyrics === "object" ? data.lyrics : {};
  state.hymnLyrics = data.hymnLyrics && typeof data.hymnLyrics === "object" ? data.hymnLyrics : {};

  const scoreIndex = data.scoreIndex && typeof data.scoreIndex === "object" ? data.scoreIndex : {};
  state.scores = {};
  Object.entries(scoreIndex).forEach(([title, keyId]) => {
    const rec = data[SCORE_PREFIX + keyId] || { images: [], songForm: "" };
    state.scores[title] = { keyId, images: rec.images || [], songForm: rec.songForm || "", ann: rec.ann || {} };
  });

  const hymnIndex = data.hymnScoreIndex && typeof data.hymnScoreIndex === "object" ? data.hymnScoreIndex : {};
  state.hymnScores = {};
  Object.entries(hymnIndex).forEach(([title, keyId]) => {
    const rec = data[HYMN_SCORE_PREFIX + keyId] || { images: [], songForm: "" };
    state.hymnScores[title] = { keyId, images: rec.images || [], songForm: rec.songForm || "", ann: rec.ann || {} };
  });
}

async function refreshFromServer(silent){
  try {
    if (!silent) setStatus("불러오는 중...");
    await loadAll();
    render();
    setStatus("최신 상태");
  } catch (e) {
    if (!silent) setStatus("불러오기 실패: " + (e && e.message ? e.message : "오류"), true);
  }
}

// Never pull from the server while local edits are still on their way up,
// otherwise fresh handwriting would be overwritten by the older server copy.
function hasPendingWork(){
  return saveInFlight || savePending || pendingDirty;
}

// pick up edits made on other devices
window.addEventListener("focus", () => {
  if (isAuthed && !hasPendingWork() && !(state.present && draw.active)) refreshFromServer(true);
});
setInterval(() => {
  if (!isAuthed) return;
  if (hasPendingWork()) return;
  if (state.present && draw.active) return;   // don't yank the page out from under a pen stroke
  if (document.visibilityState !== "visible") return;
  refreshFromServer(true);
}, 60000);

// ---------- login gate ----------
let isAuthed = false;
function showLogin(){
  isAuthed = false;
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-screen").style.display = "none";
}
function showApp(){
  isAuthed = true;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
}
async function doLogin(){
  const input = document.getElementById("login-password");
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  errEl.textContent = "";
  btn.disabled = true;
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: input.value }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { errEl.textContent = body.error || "로그인에 실패했어요."; btn.disabled = false; return; }
    input.value = "";
    showApp();
    await refreshFromServer();
  } catch (e) {
    errEl.textContent = "연결에 실패했어요.";
  } finally {
    btn.disabled = false;
  }
}
async function doLogout(){
  await fetch("/api/login", { method: "DELETE" });
  showLogin();
}

// ---------- render root ----------
function render(){
  renderTabs();
  const content=document.getElementById("content");
  if(state.tab==="home") content.innerHTML=renderHome();
  else if(state.tab==="contee") content.innerHTML=renderContee();
  else if(state.tab==="score") content.innerHTML=renderScore();
  else if(state.tab==="lyrics") content.innerHTML=renderLyrics();
  else if(state.tab==="hymn") content.innerHTML=renderHymn();
  else if(state.tab==="stats") content.innerHTML=renderStats();
  bindContentEvents();
}
function renderTabs(){
  const items=[["home","📅","이번주"],["contee","🎼","콘티"],["score","🎵","악보"],["lyrics","📄","가사"],["hymn","📖","찬송가"],["stats","📊","통계"]];
  document.getElementById("tabs").innerHTML = items.map(([id,icon,label])=>
    `<button class="tab-btn ${state.tab===id?'active':''}" data-tab="${id}">${icon} ${label}</button>`
  ).join("");
  document.querySelectorAll(".tab-btn").forEach(b=>{ b.onclick=()=>{ state.tab=b.dataset.tab; render(); }; });
}

// ================= HOME =================
function upcomingSunday(){
  const d=new Date(); d.setHours(0,0,0,0);
  const day=d.getDay();
  if(day!==0) d.setDate(d.getDate()+(7-day));
  return d;
}
function renderHome(){
  const sun = upcomingSunday();
  const thisWeek = state.setlists.find(e=>e.date===toISO(sun));
  let nextEntry=null;
  if(!thisWeek) nextEntry = state.setlists.filter(e=>parseISO(e.date)>sun).sort((a,b)=>parseISO(a.date)-parseISO(b.date))[0] || null;

  const cursor=state.ui.home.cursor;
  const grid=getMonthGrid(cursor.getFullYear(), cursor.getMonth());
  const dateSet=new Set(state.setlists.map(e=>e.date));
  const sel=state.ui.home.selectedDate;
  const selEntry = sel ? state.setlists.find(e=>e.date===sel) : null;

  const scoreCountFor = (entry) => {
    if(!entry) return 0;
    const sc = entry.songs.filter(s=>(state.scores[s]?.images?.length||0)>0).length;
    const hc = (entry.hymns||[]).filter(s=>(state.hymnScores[s]?.images?.length||0)>0).length;
    return sc+hc;
  };
  const totalFor = (entry) => entry.songs.length + (entry.hymns?entry.hymns.length:0);

  let leftHtml="";
  if(thisWeek){
    leftHtml = setlistCardHtml(thisWeek, true) + presentBtnHtml(thisWeek, scoreCountFor(thisWeek), totalFor(thisWeek));
  } else if(nextEntry){
    leftHtml = `<p style="font-size:13px;color:#8A7A56;margin-bottom:12px;">이번주 등록된 콘티가 없어요. 다음 콘티를 보여드릴게요.</p>` + setlistCardHtml(nextEntry,false) + presentBtnHtml(nextEntry, scoreCountFor(nextEntry), totalFor(nextEntry));
  } else {
    leftHtml = emptyHtml("🎼","등록된 콘티가 없어요","콘티 탭에서 새 콘티를 추가해보세요");
  }

  const calCells = grid.map(d=>{
    if(!d) return `<div></div>`;
    const iso=toISO(d);
    const has=dateSet.has(iso);
    const isToday = iso===toISO(new Date());
    const isSel = iso===sel;
    return `<button class="cal-cell ${has?'has':''} ${isToday?'today':''} ${isSel?'selected':''}" ${has?`data-cal-date="${iso}"`:''}>${d.getDate()}${has && !isSel ? '<span class="cal-dot"></span>':''}</button>`;
  }).join("");

  return `
  <div class="home-grid">
    <div class="home-spine"></div>
    <div>
      <p class="eyebrow">THIS WEEK</p>
      <h2 class="section-title">이번주 콘티</h2>
      ${leftHtml}
    </div>
    <div>
      <div class="cal-head">
        <div><p class="eyebrow">CALENDAR</p><h2 class="section-title">${cursor.getFullYear()}년 ${MONTH_KR[cursor.getMonth()]}</h2></div>
        <div class="cal-nav"><button data-cal-nav="-1">‹</button><button data-cal-nav="1">›</button></div>
      </div>
      <div class="cal-grid">
        ${WEEKDAY_KR.map((w,i)=>`<div class="cal-wd ${i===0?'sun':''}">${w}</div>`).join("")}
        ${calCells}
      </div>
      ${selEntry ? `<div style="margin-top:16px;">${setlistCardHtml(selEntry,false,true)}${presentBtnHtml(selEntry, scoreCountFor(selEntry), totalFor(selEntry))}</div>` : ""}
    </div>
  </div>`;
}
function presentBtnHtml(entry, have, total){
  return `<button class="btn btn-dark" style="width:100%;justify-content:center;margin-top:10px;" data-present-entry="${entry.id}">⤢ 악보 전체화면으로 보기 (${have}/${total}곡 악보 있음)</button>`;
}
function setlistCardHtml(entry, highlight, compact){
  const d=parseISO(entry.date);
  const hymns = entry.hymns || [];
  const yts = entry.youtubeLinks || [];
  const cls = highlight ? "card dark" : "card";
  const sub = highlight ? "#C9A66B" : "#B79A5C";
  const txt = highlight ? "#F1EDE4" : "#3E3323";
  let html = `<div class="${cls}"><p style="font-size:12px;font-weight:600;color:${sub};margin:0 0 8px;">${entry.date} · ${WEEKDAY_KR[d.getDay()]}요일</p>`;
  html += `<ol class="numlist">${entry.songs.map((s,i)=>`<li style="color:${txt};"><span class="num" style="color:${sub};">${i+1}</span><span style="font-weight:500;">${esc(s)}</span></li>`).join("")}</ol>`;
  if(hymns.length){
    html += `<div class="divider-dash" style="border-top:1px dashed ${highlight?'#3A465A':'#D8C89A'};"><p class="sub-label" style="color:${sub};">찬송가</p><ol class="numlist">${hymns.map((s,i)=>`<li style="color:${txt};"><span class="num" style="color:${sub};">${i+1}</span><span>${esc(s)}</span></li>`).join("")}</ol></div>`;
  }
  if(yts.length){
    html += `<div class="divider-dash" style="border-top:1px dashed ${highlight?'#3A465A':'#D8C89A'};"><p class="sub-label" style="color:${sub};">유튜브 링크</p><ol class="numlist">${yts.map((s,i)=>`<li><span class="num" style="color:${sub};">${i+1}</span><a class="ylink ${highlight?'dark':''}" href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(s)}</a></li>`).join("")}</ol></div>`;
  }
  html += `</div>`;
  return html;
}
function emptyHtml(icon,title,sub){
  return `<div class="empty"><div class="icon">${icon}</div><p class="t">${esc(title)}</p>${sub?`<p class="s">${esc(sub)}</p>`:""}</div>`;
}

// ---------- events ----------
// Thumbnails in the 악보/찬송가 tabs mirror the handwriting so you can tell at a
// glance which scores have notes on them. Uses object-fit:cover, so we crop the
// strokes the same way the browser crops the image.
function paintThumbAnnotations(){
  document.querySelectorAll(".img-item canvas.thumb-ann").forEach(c => c.remove());
  document.querySelectorAll("[data-view-score],[data-view-hymn]").forEach(img => {
    const isHymn = !!img.dataset.viewHymn;
    const title = isHymn ? img.dataset.viewHymn : img.dataset.viewScore;
    const idx = parseInt(img.dataset.viewIdx, 10);
    const rec = (isHymn ? state.hymnScores[title] : state.scores[title]) || {};
    const im = (rec.images || [])[idx];
    if (!im || !rec.ann) return;
    const strokes = rec.ann[im.id] || [];
    if (!strokes.length) return;

    const wrap = img.parentElement;
    const badge = document.createElement("span");
    badge.className = "ann-badge";
    badge.textContent = "✏️";
    wrap.appendChild(badge);

    const paint = () => {
      const boxW = img.clientWidth || 100, boxH = img.clientHeight || 130;
      const nw = img.naturalWidth, nh = img.naturalHeight;
      if (!nw || !nh) return;
      const cv = document.createElement("canvas");
      cv.className = "thumb-ann";
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = boxW * dpr; cv.height = boxH * dpr;
      const ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // replicate object-fit: cover
      const scale = Math.max(boxW / nw, boxH / nh);
      const dw = nw * scale, dh = nh * scale;
      const ox = (boxW - dw) / 2, oy = (boxH - dh) / 2;
      ctx.save();
      ctx.translate(ox, oy);
      paintStrokes(ctx, strokes, dw, dh);
      ctx.restore();
      wrap.appendChild(cv);
    };
    if (img.complete && img.naturalWidth) paint(); else img.onload = paint;
  });
}

function bindConteeEvents(){
  const ui=state.ui.contee;
  const tf=document.getElementById("toggle-form");
  if(tf) tf.onclick=()=>{ if(ui.showForm) resetConteForm(); else ui.showForm=true; render(); };

  const fd=document.getElementById("form-date");
  if(fd) fd.onchange=()=>{ ui.formDate=fd.value; };

  const bd = document.getElementById("bulk-details");
  if(bd) bd.ontoggle = () => { ui.bulkOpen = bd.open; };
  const bulkApply = document.getElementById("bulk-apply");
  if(bulkApply) bulkApply.onclick = () => {
    const text = document.getElementById("bulk-text").value;
    const parsed = parseBulkSetlist(text);
    ui.formSongs.push(...parsed.songs);
    ui.formHymns.push(...parsed.hymns);
    ui.bulkOpen = false;
    render();
  };

  const arrKeyMap = { songs: "formSongs", hymns: "formHymns", youtube: "formYoutube" };
  ["songs","hymns","youtube"].forEach(key=>{
    const input=document.getElementById("input-"+key);
    if(!input) return;
    const addFn=()=>{ const v=input.value.trim(); if(!v) return; ui[arrKeyMap[key]].push(v); render(); };
    input.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); addFn(); } };
  });
  document.querySelectorAll("[data-add-item]").forEach(b=>{
    b.onclick=()=>{ const key=b.dataset.addItem; const input=document.getElementById("input-"+key); const v=input.value.trim(); if(!v) return; ui[arrKeyMap[key]].push(v); render(); };
  });
  document.querySelectorAll("[data-remove-item]").forEach(b=>{
    b.onclick=()=>{ const key=b.dataset.removeItem, idx=parseInt(b.dataset.idx,10); ui[arrKeyMap[key]].splice(idx,1); render(); };
  });
  document.querySelectorAll("[data-move-item]").forEach(b=>{
    b.onclick=()=>{
      const key=b.dataset.moveItem, idx=parseInt(b.dataset.idx,10), dir=parseInt(b.dataset.dir,10);
      const arr=ui[arrKeyMap[key]]; const j=idx+dir;
      if(j<0||j>=arr.length) return;
      [arr[idx],arr[j]]=[arr[j],arr[idx]];
      render();
    };
  });
  document.querySelectorAll("[data-edit-item]").forEach(el=>{
    el.onclick=()=>{
      const key=el.dataset.editItem, idx=parseInt(el.dataset.idx,10);
      const arr=ui[arrKeyMap[key]];
      const nv = prompt("수정할 내용을 입력하세요", arr[idx]);
      if(nv!==null && nv.trim()){ arr[idx]=nv.trim(); render(); }
    };
  });

  const submitBtn=document.getElementById("submit-entry");
  if(submitBtn) submitBtn.onclick=()=>{
    if(!ui.formDate || ui.formSongs.length===0) return;
    const payload={ songs:[...ui.formSongs], hymns:[...ui.formHymns], youtubeLinks:[...ui.formYoutube] };
    if(ui.editingId){
      state.setlists = state.setlists.filter(e=>e.id!==ui.editingId);
    }
    const idx=state.setlists.findIndex(e=>e.date===ui.formDate);
    if(idx>=0) state.setlists[idx]={...state.setlists[idx], ...payload};
    else state.setlists.push({id: ui.editingId || uid(), date: ui.formDate, ...payload});
    resetConteForm();
    scheduleSave(); render();
  };
  const cancelEdit = document.getElementById("cancel-edit");
  if(cancelEdit) cancelEdit.onclick = () => { resetConteForm(); render(); };

  document.querySelectorAll("[data-edit-entry]").forEach(b=>{
    b.onclick=()=>{
      const entry = state.setlists.find(e=>e.id===b.dataset.editEntry);

      ui.formDate = entry.date;
      ui.formSongs = [...entry.songs];
      ui.formHymns = [...(entry.hymns||[])];

  document.querySelectorAll("[data-del-entry]").forEach(b=>{

      const id=b.dataset.delEntry;
      if(ui.confirmDeleteId===id){ state.setlists=state.setlists.filter(e=>e.id!==id); ui.confirmDeleteId=null; scheduleSave(); render(); }
      else { ui.confirmDeleteId=id; render(); setTimeout(()=>{ if(ui.confirmDeleteId===id){ ui.confirmDeleteId=null; render(); } },3000); }
    };
  });
}

    const oldTitle=ui.renamingTitle;
    const inp=document.getElementById("rename-input");
    const newTitle=(inp.value||"").trim();
    if(!newTitle || newTitle===oldTitle){ ui.renamingTitle=null; render(); return; }
    renameSongEverywhere(oldTitle,newTitle);
    ui.renamingTitle=null; scheduleSave(); render();
  };
  if(commitBtn) commitBtn.onclick=doRename;
  const renameInput=document.getElementById("rename-input");
  if(renameInput) renameInput.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); doRename(); } if(e.key==="Escape"){ e.preventDefault(); ui.renamingTitle=null; render(); } };
}
function renameSongEverywhere(oldTitle,newTitle){
  state.setlists.forEach(e=>{ if(e.songs.includes(oldTitle)) e.songs=e.songs.map(s=>s===oldTitle?newTitle:s); });
  if(oldTitle in state.scores){
    const rec=state.scores[oldTitle]; delete state.scores[oldTitle];
    const existing = state.scores[newTitle];
    // reuse an existing keyId so the server row (and its images) doesn't get re-uploaded
    state.scores[newTitle] = existing
      ? { keyId: existing.keyId || rec.keyId,
          images:[...existing.images, ...rec.images],
          songForm: existing.songForm||rec.songForm||"",
          ann: Object.assign({}, existing.ann||{}, rec.ann||{}) }
      : rec;
  }
  if(oldTitle in state.lyrics){
    const text=state.lyrics[oldTitle]; delete state.lyrics[oldTitle];
    if(state.lyrics[newTitle]===undefined || state.lyrics[newTitle]==="") state.lyrics[newTitle]=text;
  }
}

// ================= 통계 =================
// Counts every praise song and hymn appearance inside the selected period.
function computeStats(){
  const ui = state.ui.stats;
  const rows = {};   // title -> {title, type, count, dates[]}
  state.setlists.forEach(e => {
    if (ui.year !== "all" && e.date.slice(0,4) !== ui.year) return;
    if (ui.month !== "all" && e.date.slice(5,7) !== ui.month) return;
    const add = (title, type) => {
      if (!rows[title]) rows[title] = { title, type, count:0, dates:[] };
      rows[title].count++;
      rows[title].dates.push(e.date);
    };
    e.songs.forEach(t => add(t, "song"));
    (e.hymns||[]).forEach(t => add(t, "hymn"));
  });
  const q = ui.search.trim().toLowerCase();
  return Object.values(rows)
    .filter(r => !q || r.title.toLowerCase().includes(q))
    .map(r => ({ ...r, dates: r.dates.sort().reverse() }))
    .sort((a,b) => b.count - a.count || a.title.localeCompare(b.title,"ko"));
}

  const all = computeStats();

  const totalServices = state.setlists.filter(e =>
    (ui.year==="all" || e.date.slice(0,4)===ui.year) && (ui.month==="all" || e.date.slice(5,7)===ui.month)

  return `
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;">

      </select>
      <select id="stats-month">
        <option value="all" ${ui.month==="all"?"selected":""}>전체 월</option>
        ${MONTH_KR.map((m,i)=>`<option value="${pad2(i+1)}" ${ui.month===pad2(i+1)?'selected':''}>${m}</option>`).join("")}
      </select>
    </div>
  </div>

  <div class="row" style="margin-bottom:14px;flex-wrap:wrap;">
    <input type="search" id="stats-search" placeholder="곡 제목 검색" value="${esc(ui.search)}" style="flex:1;min-width:180px;" />
    <button class="btn btn-brass" id="stats-excel">⬇ 엑셀 다운로드</button>
  </div>

  <p class="warn" style="margin-bottom:16px;">${periodLabel} · 예배 ${totalServices}회 · 곡 ${all.length}개</p>

  ${all.length === 0 ? emptyHtml("📊","조건에 맞는 기록이 없어요","기간을 바꾸거나 콘티를 추가해보세요") : `
    <div class="card" style="margin-bottom:20px;">
      <p class="sub-label" style="margin-bottom:12px;">가장 많이 부른 찬양 TOP ${top.length}</p>
      ${top.map((r,i)=>`
        <div class="stat-row">
          <span class="stat-rank">${i+1}</span>
          <span class="stat-title" title="${esc(r.title)}">${esc(r.title)}${r.type==="hymn"?" (찬송가)":""}</span>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(r.count/maxCount*100)}%;"></div></div>
          <span class="stat-count">${r.count}회</span>
        </div>`).join("")}
    </div>

    <p class="sub-label">전체 목록</p>
    <div style="overflow-x:auto;">
      <table class="stats-table">
        <thead><tr><th>#</th><th>곡 제목</th><th>구분</th><th>횟수</th><th>최근 사용일</th></tr></thead>
        <tbody>
          ${visible.map((r,i)=>`<tr>
            <td>${i+1}</td>
            <td>${esc(r.title)}</td>
            <td>${r.type==="hymn"?"찬송가":"찬양"}</td>
            <td style="text-align:right;font-weight:600;">${r.count}</td>

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">

<tbody>${body}</tbody>
</table>
</body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);

// ================= PRESENTATION MODAL =================
// The viewer is page-based: one score image per page. Moving past the last page of a
// song lands on the next song, so a 2-page score behaves just like flipping slides.
function openPresent(entry){
  setDrawMode(false);
  state.present = { mode:"entry", entryId: entry.id, idx: 0, focus:false };
  document.getElementById("present").classList.add("open"); // must be visible first, or the canvas measures 0
  renderPresent();
}
// Opens just one song's scores (used when tapping a thumbnail in the 악보/찬송가 tab)
function openSongViewer(title, type, startIdx){
  setDrawMode(false);
  state.present = { mode:"song", title, type: type||"song", idx: startIdx||0, focus:false };
  document.getElementById("present").classList.add("open"); // must be visible first, or the canvas measures 0
  renderPresent();
}
function closePresent(){
  setDrawMode(false);
  state.present = null;
  const el = document.getElementById("present");
  el.classList.remove("open");
  el.classList.remove("focus");
  render();   // refresh the tab behind so new handwriting shows on the thumbnails
}
function presentSlides(entry){
  return [
    ...entry.songs.map(s=>({title:s,type:"song"})),
    ...(entry.hymns||[]).map(s=>({title:s,type:"hymn"})),
  ];
}
function recFor(title, type){
  return (type==="hymn" ? state.hymnScores[title] : state.scores[title]) || {images:[],songForm:""};
}
// flatten songs -> one page per image
function pagesForSlides(slides){
  const pages = [];
  slides.forEach((sl, songNo) => {
    const rec = recFor(sl.title, sl.type);
    if (rec.images.length === 0) {
      pages.push({ title:sl.title, type:sl.type, im:null, page:1, total:0, songNo:songNo+1 });
    } else {
      rec.images.forEach((im, i) => {
        pages.push({ title:sl.title, type:sl.type, im, page:i+1, total:rec.images.length, songNo:songNo+1 });
      });
    }
  });
  return pages;
}
function currentPages(){
  if (!state.present) return [];
  if (state.present.mode === "song") {
    return pagesForSlides([{ title: state.present.title, type: state.present.type }]);
  }
  const entry = state.setlists.find(e=>e.id===state.present.entryId);
  if (!entry) return [];
  return pagesForSlides(presentSlides(entry));
}
function escapeHtmlStr(s){ const d=document.createElement("div"); d.textContent=String(s); return d.innerHTML; }

function renderPresent(){
  if(!state.present) return;
  const pages = currentPages();
  if(pages.length === 0){ closePresent(); return; }
  if(state.present.idx >= pages.length) state.present.idx = pages.length-1;
  if(state.present.idx < 0) state.present.idx = 0;

  const cur = pages[state.present.idx];
  const isHymn = cur.type === "hymn";
  const rec = recFor(cur.title, cur.type);
  const songMode = state.present.mode === "song";

  // header
  let dateLine = "";
  if (songMode) {
    dateLine = isHymn ? "찬송가" : "악보";
  } else {
    const entry = state.setlists.find(e=>e.id===state.present.entryId);
    const d = parseISO(entry.date);
    dateLine = `${entry.date} · ${WEEKDAY_KR[d.getDay()]}요일${isHymn?' · 찬송가':''}`;
  }
  if (cur.total > 1) dateLine += ` · 악보 ${cur.page}/${cur.total}장`;
  document.getElementById("p-date").textContent = dateLine;
  const lbl = document.getElementById("p-page-label");
  if (lbl) lbl.textContent = (songMode ? cur.title : `${cur.songNo}. ${cur.title}`) + (cur.total > 1 ? ` · ${cur.page}/${cur.total}장` : "");
  document.getElementById("p-title").textContent = songMode ? cur.title : `${cur.songNo}. ${cur.title}`;

  // export buttons only make sense for a full setlist
  document.getElementById("p-pdf").style.display = songMode ? "none" : "";
  document.getElementById("p-txt").style.display = songMode ? "none" : "";

  const sf = document.getElementById("p-songform");
  sf.value = rec.songForm || "";
  sf.oninput = () => {
    const store = isHymn ? state.hymnScores : state.scores;
    if(!store[cur.title]) store[cur.title] = {keyId: uid(), images:[], songForm:""};
    store[cur.title].songForm = sf.value;
    clearTimeout(window.__pDeb); window.__pDeb = setTimeout(scheduleSave, 300);
  };

  const imgwrap = document.getElementById("p-imgwrap");
  if(!cur.im){
    imgwrap.innerHTML = `<div class="p-noimg">이 곡에 등록된 악보 이미지가 없어요. ${isHymn?'찬송가 탭':'악보 탭'}에서 추가할 수 있어요.</div>`;
  } else {
    imgwrap.innerHTML = `<div class="p-imgs"><div class="p-stage"><img id="p-img" src="${imgSrc(cur.im)}" /><canvas id="p-canvas"></canvas></div></div>`;
    const imgEl = document.getElementById("p-img");
    const cvEl = document.getElementById("p-canvas");
    cvEl.style.pointerEvents = draw.active ? "auto" : "none";
    const redraw = () => syncCanvas(cur);
    imgEl.onload = redraw;
    if (imgEl.complete) redraw();
    // decode() fires after the browser has laid the image out at its final size
    if (imgEl.decode) imgEl.decode().then(redraw).catch(()=>{});
    requestAnimationFrame(redraw);
  }

  document.getElementById("p-prev").disabled = state.present.idx===0;
  document.getElementById("p-next").disabled = state.present.idx===pages.length-1;

  // a dot per page; new songs get a wider separator dot so the grouping stays readable
  document.getElementById("p-dots").innerHTML = pages.map((pg,i)=>{
    const on = i===state.present.idx;
    const firstOfSong = pg.page === 1;
    const w = on ? 18 : (firstOfSong ? 8 : 5);
    const h = on ? 6 : (firstOfSong ? 6 : 4);
    return `<button data-dot="${i}" class="${on?'on':''}" style="width:${w}px;height:${h}px;" title="${escapeHtmlStr(pg.title)}${pg.total>1?` (${pg.page}/${pg.total})`:''}"></button>`;
  }).join("");
  document.querySelectorAll("#p-dots [data-dot]").forEach(b=>{ b.onclick=()=>{ state.present.idx=parseInt(b.dataset.dot,10); renderPresent(); }; });

  document.getElementById("present").classList.toggle("focus", state.present.focus);
  // a new page should start at the top of the score
  const content = document.querySelector(".p-content");
  if (content) content.scrollTop = 0;
}
// ---------- 악보 필기 (annotation) ----------
// Strokes are stored per image as normalised 0..1 coordinates, so the same marks
// line up correctly on a phone, tablet or desktop regardless of display size.
const draw = { active:false, tool:"pen", color:"#E02B2B", drawingNow:false, cur:null, pts:[] };

function annStoreFor(type){ return type==="hymn" ? state.hymnScores : state.scores; }
function getStrokes(page){
  if (!page || !page.im) return [];
  const rec = annStoreFor(page.type)[page.title];
  if (!rec || !rec.ann) return [];
  return rec.ann[page.im.id] || [];
}
function setStrokes(page, strokes){
  const store = annStoreFor(page.type);
  if (!store[page.title]) store[page.title] = { keyId: uid(), images: [], songForm: "" };
  const rec = store[page.title];
  if (!rec.ann) rec.ann = {};
  if (strokes.length) rec.ann[page.im.id] = strokes;
  else delete rec.ann[page.im.id];
  scheduleSave();
}

function strokeStyle(ctx, st, scale){
  if (st.t === "hl") {
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(10, 16 * scale);
  } else {
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1.6, 3 * scale);
  }
  ctx.strokeStyle = st.c;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}

function paintStrokes(ctx, strokes, w, h){
  const scale = w / 800; // reference width so line weight feels consistent
  strokes.forEach(st => {
    if (!st.p || st.p.length === 0) return;
    strokeStyle(ctx, st, scale);
    ctx.beginPath();
    st.p.forEach((pt, i) => {
      const x = pt[0] * w, y = pt[1] * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if (st.p.length === 1) ctx.lineTo(st.p[0][0]*w + 0.1, st.p[0][1]*h + 0.1);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

// resize the canvas to match the rendered image and repaint saved strokes
function syncCanvas(page, attempt){
  const img = document.getElementById("p-img");
  const cv = document.getElementById("p-canvas");
  if (!img || !cv) return;
  const rect = img.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) {
    // layout isn't settled yet (image still decoding, modal just opened) — try again shortly
    const n = (attempt || 0) + 1;
    if (n <= 20) requestAnimationFrame(() => syncCanvas(page, n));
    return;
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  paintStrokes(ctx, getStrokes(page), rect.width, rect.height);
  bindCanvas(cv, page);
}

function canvasPoint(cv, ev){
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width;
  const y = (ev.clientY - r.top) / r.height;
  return [Math.min(1, Math.max(0, +x.toFixed(4))), Math.min(1, Math.max(0, +y.toFixed(4)))];
}

// removes any stroke passing near the eraser point
function eraseAt(page, pt){
  const strokes = getStrokes(page);
  const keep = strokes.filter(st => !st.p.some(p => Math.hypot(p[0]-pt[0], p[1]-pt[1]) < 0.025));
  if (keep.length !== strokes.length) {
    setStrokes(page, keep);
    syncCanvas(page);
  }
}

function bindCanvas(cv, page){
  if (cv.__bound) return;
  cv.__bound = true;

  const start = (ev) => {
    if (!draw.active) return;
    ev.preventDefault();
    cv.setPointerCapture(ev.pointerId);
    const pt = canvasPoint(cv, ev);
    if (draw.tool === "eraser") { draw.drawingNow = true; eraseAt(page, pt); return; }
    draw.drawingNow = true;
    draw.pts = [pt];
  };
  const move = (ev) => {
    if (!draw.active || !draw.drawingNow) return;
    ev.preventDefault();
    const pt = canvasPoint(cv, ev);
    if (draw.tool === "eraser") { eraseAt(page, pt); return; }
    const last = draw.pts[draw.pts.length - 1];
    if (last && Math.hypot(pt[0]-last[0], pt[1]-last[1]) < 0.003) return;
    draw.pts.push(pt);
    // live preview of the stroke in progress
    const rect = cv.getBoundingClientRect();
    const ctx = cv.getContext("2d");
    const st = { t: draw.tool === "hl" ? "hl" : "pen", c: draw.color, p: draw.pts };
    ctx.clearRect(0, 0, rect.width, rect.height);
    paintStrokes(ctx, getStrokes(page).concat([st]), rect.width, rect.height);
  };
  const end = (ev) => {
    if (!draw.active || !draw.drawingNow) return;
    draw.drawingNow = false;
    if (draw.tool === "eraser") return;
    if (draw.pts.length === 0) return;
    const st = { t: draw.tool === "hl" ? "hl" : "pen", c: draw.color, p: draw.pts };
    setStrokes(page, getStrokes(page).concat([st]));
    draw.pts = [];
    syncCanvas(page);
  };

  cv.addEventListener("pointerdown", start);
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  cv.addEventListener("pointerleave", end);
}

function setDrawMode(on){
  draw.active = on;
  document.getElementById("present").classList.toggle("drawing", on);
  const cv = document.getElementById("p-canvas");
  if (cv) cv.style.pointerEvents = on ? "auto" : "none";
}

function currentPage(){
  const pages = currentPages();
  return pages[state.present ? state.present.idx : 0] || null;
}

// toolbar wiring
document.querySelectorAll(".p-swatch").forEach(b => {
  b.onclick = () => {
    draw.color = b.dataset.color;
    document.querySelectorAll(".p-swatch").forEach(x => x.classList.toggle("on", x === b));
  };
});
function selectTool(id){
  draw.tool = id;
  document.getElementById("p-tool-pen").classList.toggle("on", id === "pen");
  document.getElementById("p-tool-hl").classList.toggle("on", id === "hl");
  document.getElementById("p-tool-eraser").classList.toggle("on", id === "eraser");
}
document.getElementById("p-tool-pen").onclick = () => selectTool("pen");
document.getElementById("p-tool-hl").onclick = () => selectTool("hl");
document.getElementById("p-tool-eraser").onclick = () => selectTool("eraser");
document.getElementById("p-tool-undo").onclick = () => {
  const page = currentPage();
  if (!page || !page.im) return;
  const strokes = getStrokes(page).slice(0, -1);
  setStrokes(page, strokes);
  syncCanvas(page);
};
document.getElementById("p-tool-clear").onclick = () => {
  const page = currentPage();
  if (!page || !page.im) return;
  if (!confirm("이 악보의 필기를 모두 지울까요?")) return;
  setStrokes(page, []);
  syncCanvas(page);
};
document.getElementById("p-tool-done").onclick = () => setDrawMode(false);
document.getElementById("p-draw").onclick = () => {
  const page = currentPage();
  if (!page || !page.im) { alert("악보 이미지가 있어야 필기할 수 있어요."); return; }
  setDrawMode(!draw.active);
};

window.addEventListener("resize", () => {
  if (!state.present) return;
  const page = currentPage();
  if (page && page.im) syncCanvas(page);
});

function presentGo(dir){
  if(!state.present) return;
  if(draw.active) return;   // stay on the page while annotating
  const pages = currentPages();
  state.present.idx = Math.max(0, Math.min(pages.length-1, state.present.idx+dir));
  renderPresent();
}
// inline=true embeds image bytes (needed for .doc so it works offline);
// inline=false keeps Blob URLs, which the print window can fetch directly.
async function presentBuildPrintable(entry, inline){
  const slides = presentSlides(entry);
  const rows = slides.map((sl,i)=>{
    const r=(sl.type==="hymn"?state.hymnScores[sl.title]:state.scores[sl.title])||{songForm:""};
    return `<tr><td style="border:1px solid #333;padding:4px;text-align:center;">${i+1}</td><td style="border:1px solid #333;padding:4px;">${escapeHtmlStr(sl.title)}${sl.type==="hymn"?" (찬송가)":""}</td><td style="border:1px solid #333;padding:4px;">${escapeHtmlStr(r.songForm||"")}</td></tr>`;
  }).join("");
  const blockParts = [];
  for (let i=0;i<slides.length;i++){
    const sl = slides[i];
    const r=(sl.type==="hymn"?state.hymnScores[sl.title]:state.scores[sl.title])||{images:[],songForm:""};
    const srcs = [];
    for (const im of r.images){
      const strokes = (r.ann && r.ann[im.id]) || [];
      // burn the handwriting into the image so printouts match what's on screen
      const flat = strokes.length ? await flattenAnnotated(im, strokes) : null;
      srcs.push(flat || (inline ? await toDataUrl(im) : imgSrc(im)));
    }
    const imgs = srcs.filter(Boolean).map(src=>`<img src="${src}" style="width:100%;display:block;margin-bottom:6px;" />`).join("");
    blockParts.push(`<div style="break-inside:avoid;margin-bottom:14px;border:1px solid #999;padding:6px;">
      <div style="font-weight:bold;font-size:11pt;margin-bottom:4px;">${i+1}. ${escapeHtmlStr(sl.title)}${sl.type==="hymn"?" (찬송가)":""}${r.songForm?` — ${escapeHtmlStr(r.songForm)}`:""}</div>
      ${imgs || "<p style='color:#888;font-size:9pt;'>(등록된 악보 없음)</p>"}
    </div>`);
  }
  return {rows, blocks: blockParts.join("")};
}

document.getElementById("p-prev").onclick=()=>presentGo(-1);
document.getElementById("p-next").onclick=()=>presentGo(1);
document.getElementById("p-touch-left").onclick=()=>presentGo(-1);
document.getElementById("p-touch-right").onclick=()=>presentGo(1);
document.getElementById("p-close").onclick=closePresent;
document.getElementById("p-exit-btn").onclick=()=>{ state.present.focus=false; renderPresent(); };
document.getElementById("p-focus").onclick=()=>{ state.present.focus=true; renderPresent(); };
document.getElementById("p-txt").onclick=()=>{
  const entry = state.setlists.find(e=>e.id===state.present.entryId);
  const slides = presentSlides(entry);
  const parts = slides.map(sl=>((sl.type==="hymn"?state.hymnLyrics[sl.title]:state.lyrics[sl.title])||"").trim()).filter(Boolean);
  downloadTextFile(`${entry.date}_가사.txt`, parts.join("\n"));
};
document.getElementById("p-pdf").onclick=async ()=>{
  const entry = state.setlists.find(e=>e.id===state.present.entryId);
  setStatus("인쇄 준비 중...");
  const {rows, blocks} = await presentBuildPrintable(entry, false);
  setStatus("");
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtmlStr(entry.date)} 주일찬양</title>
<style>@page{size:A3 landscape;margin:12mm;} body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;margin:0;padding:16px;} table{border-collapse:collapse;width:100%;margin-bottom:14px;} .wd-cols{column-count:3;column-gap:14px;} img{max-width:100%;}</style>
</head><body><h2 style="margin:0 0 8px;">${escapeHtmlStr(entry.date)} 주일찬양</h2>
<table><thead><tr><th style="border:1px solid #333;padding:4px;">#</th><th style="border:1px solid #333;padding:4px;">제목</th><th style="border:1px solid #333;padding:4px;">송폼</th></tr></thead><tbody>${rows}</tbody></table>
<div class="wd-cols">${blocks}</div>
<script>window.onload=function(){setTimeout(function(){window.print();},200);};<\/script>
</body></html>`;
  const w=window.open("","_blank");
  if(!w){ downloadTextFile(`${entry.date}_인쇄용.html`, html); return; }
  w.document.open(); w.document.write(html); w.document.close();
};
window.addEventListener("keydown",(e)=>{
  if(!state.present) return;
  if(draw.active){
    if(e.key==="Escape"){ e.preventDefault(); setDrawMode(false); }
    return;
  }
  if(e.key==="ArrowRight") presentGo(1);
  if(e.key==="ArrowLeft") presentGo(-1);
  if(e.key==="Escape"){ if(state.present.focus){ state.present.focus=false; renderPresent(); } else closePresent(); }
});
let touchStartX=null;
document.getElementById("present").addEventListener("touchstart",(e)=>{ if(draw.active){touchStartX=null;return;} touchStartX=e.touches[0].clientX; });
document.getElementById("present").addEventListener("touchend",(e)=>{
  if(draw.active) return;
  if(touchStartX==null) return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>50){ if(dx<0) presentGo(1); else presentGo(-1); }
  touchStartX=null;
});

// ---------- manual backup (export/import) ----------
function exportBackup(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    setlists: state.setlists,
    scores: state.scores,
    lyrics: state.lyrics,
    hymnScores: state.hymnScores,
    hymnLyrics: state.hymnLyrics,
  };
  downloadTextFile(`worship-dashboard-backup-${toISO(new Date())}.json`, JSON.stringify(data));
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch (err) { alert("백업 파일을 읽을 수 없어요. 파일이 손상되었거나 형식이 맞지 않아요."); return; }
    if (!data || typeof data !== "object") { alert("올바른 백업 파일이 아니에요."); return; }
    if (!confirm("백업을 불러오면 서버의 기존 데이터를 덮어써요. 모든 기기에 반영됩니다. 계속할까요?")) return;
    state.setlists = Array.isArray(data.setlists) ? data.setlists : [];
    state.scores = (data.scores && typeof data.scores === "object") ? data.scores : {};
    Object.values(state.scores).forEach(r => { if (!r.keyId) r.keyId = uid(); });
    state.lyrics = (data.lyrics && typeof data.lyrics === "object") ? data.lyrics : {};
    state.hymnScores = (data.hymnScores && typeof data.hymnScores === "object") ? data.hymnScores : {};
    Object.values(state.hymnScores).forEach(r => { if (!r.keyId) r.keyId = uid(); });
    state.hymnLyrics = (data.hymnLyrics && typeof data.hymnLyrics === "object") ? data.hymnLyrics : {};
    scheduleSave();
    render();
    alert("백업을 불러왔어요.");
  };
  reader.onerror = () => alert("파일을 읽는 중 오류가 발생했어요.");
  reader.readAsText(file, "utf-8");
}
document.getElementById("backup-export").onclick = exportBackup;
document.getElementById("backup-import-btn").onclick = () => document.getElementById("backup-import-file").click();
document.getElementById("backup-import-file").onchange = (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) importBackupFile(file);
  e.target.value = "";
};

// Tells the user which deployment step is still missing, instead of a raw DB error.
async function checkSetup(){
  const el = document.getElementById("setup-note");
  if (!el) return;
  try {
    const res = await fetch("/api/health");
    const h = await res.json();
    const problems = [];
    if (!h.passwordSet) problems.push("환경변수 APP_PASSWORD 가 없어요.");
    if (!h.dbEnvVar) problems.push("데이터베이스가 연결되지 않았어요. Storage 탭에서 Postgres를 만들고 Connect한 뒤 Redeploy 해주세요.");
    else if (!h.dbConnected) problems.push("데이터베이스 연결 오류: " + (h.error || ""));
    if (!h.blobSet) problems.push("이미지 저장소(Blob)가 없어요. Storage 탭에서 Blob을 만들고 Connect하면 큰 악보도 원본 화질로 올라가요.");
    if (!h.authSecretSet) problems.push("환경변수 AUTH_SECRET 을 넣으면 로그인이 오래 유지돼요.");
    if (problems.length === 0) { el.textContent = "설정 완료 · 비밀번호를 입력하세요"; el.style.color = "var(--ink-sub)"; }
    else { el.innerHTML = problems.map(p => "• " + p).join("<br>"); el.style.color = "#D9776A"; }
  } catch (e) { /* health endpoint unavailable, stay quiet */ }
}

// ---------- init ----------
document.getElementById("login-btn").onclick = doLogin;
document.getElementById("login-password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); doLogin(); }
});
document.getElementById("logout-btn").onclick = doLogout;
document.getElementById("refresh-btn").onclick = () => refreshFromServer();

(async () => {
  try {
    const res = await fetch("/api/login");
    const body = await res.json().catch(() => ({}));
    if (body && body.authed) {
      showApp();
      await refreshFromServer();
    } else {
      showLogin();
      if (body && body.error) document.getElementById("login-error").textContent = body.error;
      checkSetup();
    }
  } catch (e) {
    showLogin();
    document.getElementById("login-error").textContent = "서버에 연결할 수 없어요.";
  }
})();
